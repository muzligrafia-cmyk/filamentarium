:root{
  /* paletta: Blue #0076F7 · Light Blue #B2D6FD · Teal #8AD3D3 · Dark Teal #284949 · Yellow #EBEA76 · Light #FFF · Dark #1D1D1E */
  --bg:#F0F0F6; --surface:#FFFFFF; --surface2:#E7E7EF; --line:#DCDCE6; --ink:#1D1D1E; --ink2:#55555F; --ink3:#86868F;
  --accent:#0076F7; --accent-ink:#FFFFFF; --accent-soft:#B2D6FD; --accent-tint:#E3EFFE;
  --ok:#284949; --ok-bar:#5FBDBD; --ok-soft:#D3EFEF;
  --run:#0076F7; --run-soft:#E3EFFE;
  --wait:#6A6914; --wait-bar:#D9D74E; --wait-soft:#F5F4C4;
  --bad:#D93A40; --bad-soft:#FBE1E2;
  --sel:#1D1D1E; --sel-ink:#FFFFFF;
  --st-kesz:#1E7A3C; --st-kesz-bg:#D9F2E0; --st-fut:#6A6914; --st-fut-bg:#F2F0A8; --st-felv:#0B5BB5; --st-felv-bg:#CFE5FE; --st-felv-bar:#7DB6F8; --st-fut-bar:#D9D74E;
  --fs-p:18px; --fs-h1:24px; --fs-h2:20px; --fs-h3:17px; --fs-label:15px; --fs-ctl:17px; --fs-small:14px; --fs-num:28px; --ctl:44px; --chip:38px; --r:10px; --rs:7px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#131315; --surface2:#1E1E21; --line:#2A2A2F; --ink:#F2F2F5; --ink2:#B4B4BE; --ink3:#7E7E88;
  --accent:#3D95FF; --accent-ink:#FFFFFF; --accent-soft:#16365E; --accent-tint:#0E2240;
  --ok:#8AD3D3; --ok-bar:#5FBDBD; --ok-soft:#173232;
  --run:#6FB0FF; --run-soft:#0E2240;
  --wait:#EBEA76; --wait-bar:#C9C84F; --wait-soft:#2B2B12;
  --bad:#FF6B70; --bad-soft:#3A1517;
  --sel:#F2F2F5; --sel-ink:#000000;
  --st-kesz:#7FD69A; --st-kesz-bg:#123020; --st-fut:#EBEA76; --st-fut-bg:#2F2E10; --st-felv:#9CC8FF; --st-felv-bg:#12305A; --st-felv-bar:#5C9EEB; --st-fut-bar:#C9C84F;
  color-scheme:dark;
}
@media (min-width:900px){ :root{ --ctl:38px; --chip:34px; } }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:400 var(--fs-p)/1.4 Mulish,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{display:block;fill:currentColor}

/* ---------- elrendezés ---------- */
#app{display:flex;min-height:100%}
#side{display:none}
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;height:100dvh}
#top{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 14px) 10px 8px 16px;background:var(--bg);z-index:5}
#top .logo{height:13px;width:auto}
#top h1{display:none;font-size:var(--fs-h1);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.01em}
#top .sp{flex:1}
.iconbtn{width:var(--ctl);height:var(--ctl);border-radius:var(--rs);border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover,.iconbtn:active{background:var(--surface2)}
#sync{font-size:var(--fs-small);color:var(--ink3);display:flex;align-items:center;gap:6px;padding:0 4px}
#sync .dot{width:9px;height:9px;border-radius:50%;background:var(--ok-bar)}
#sync.off .dot{background:var(--wait-bar)} #sync.err .dot{background:var(--bad)} #sync.busy .dot{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.vtog{display:flex;background:var(--surface2);border-radius:var(--rs);padding:3px;gap:2px}
.vtog button{width:34px;height:30px;border:0;border-radius:5px;background:transparent;display:grid;place-items:center;color:var(--ink3)}
.vtog button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
#view{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:2px 12px calc(110px + env(safe-area-inset-bottom))}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
#nav button{flex:1;border:0;background:transparent;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:var(--fs-small);color:var(--ink3);font-weight:700}
#nav button svg.i{width:22px;height:22px}
#nav button.on{color:var(--accent)}
.fab{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:21;height:50px;padding:0 20px 0 16px;border-radius:var(--r);border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:var(--fs-ctl);display:flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,118,247,.3)}
.fab svg.i{stroke-width:2.6}

@media (min-width:900px){
  #side{display:flex;flex-direction:column;gap:2px;width:240px;flex:none;padding:26px 14px;border-right:1px solid var(--line);height:100vh;position:sticky;top:0;background:var(--surface)}
  #side .logo{width:176px;height:auto;margin:4px 10px 24px}
  #side .navb{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:var(--rs);min-height:40px;padding:0 12px;font-size:var(--fs-ctl);font-weight:700;color:var(--ink2);text-align:left}
  #side .navb:hover{background:var(--surface2)}
  #side .navb.on{background:var(--accent-tint);color:var(--accent)}
  #side .newbtn{margin:0 0 14px;height:42px;border-radius:var(--rs);border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:var(--fs-ctl);display:flex;align-items:center;justify-content:center;gap:8px}
  #side .spacer{flex:1}
  #nav,.fab{display:none}
  #top{padding:22px 28px 10px 32px}
  #top .logo{display:none}
  #top h1{display:block}
  #view{padding:4px 32px 50px}
}

/* ---------- közös ---------- */
.wrap{margin:0 auto;width:100%;max-width:1400px}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
.sec-title{font-size:var(--fs-label);font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:22px 2px 8px}
.muted{color:var(--ink2)} .small{font-size:var(--fs-label)} .faint{color:var(--ink3)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{min-height:var(--ctl);padding:0 16px;border-radius:var(--rs);border:1px solid var(--line);background:var(--surface);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:var(--fs-ctl);white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.ok{background:var(--st-kesz-bg);color:var(--st-kesz);border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-small);font-weight:800;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.run{background:var(--run-soft);color:var(--run)}
.pill.wait{background:var(--wait-soft);color:var(--wait)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-tint);color:var(--accent)}
/* státuszok – mint a táblázatban: Kész zöld, Fut sárga, Felvéve világoskék, Rossz piros */
.pill.st-kesz{background:var(--st-kesz-bg);color:var(--st-kesz)} .pill.st-fut{background:var(--st-fut-bg);color:var(--st-fut)}
.pill.st-felveve{background:var(--st-felv-bg);color:var(--st-felv)} .pill.st-rossz{background:var(--bad-soft);color:var(--bad)}
.seg button.on[data-seg="status"][data-v="Kész"]{background:var(--st-kesz-bg);color:var(--st-kesz)}
.seg button.on[data-seg="status"][data-v="Fut"]{background:var(--st-fut-bg);color:var(--st-fut)}
.seg button.on[data-seg="status"][data-v="Felvéve"]{background:var(--st-felv-bg);color:var(--st-felv)}
.seg button.on[data-seg="status"][data-v="Rossz"]{background:var(--bad-soft);color:var(--bad)}
.sw{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid rgba(128,128,128,.45);display:inline-block}
.pdot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.bar.ok>i{background:var(--ok-bar)} .bar.warn>i{background:var(--wait-bar)} .bar.bad>i{background:var(--bad)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:0 12px;min-height:var(--ctl)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;font-size:var(--fs-ctl);height:calc(var(--ctl) - 2px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior:contain;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{min-height:var(--chip);padding:0 12px;border-radius:var(--rs);border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:calc(var(--fs-ctl) - 1px);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;max-width:100%}
.chip:hover{border-color:var(--ink3)}
.chip span.t{overflow:hidden;text-overflow:ellipsis}
.chip.on{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.chip.add{border-style:dashed;color:var(--accent);border-color:var(--accent-soft)}
.seg{display:flex;background:var(--surface2);border-radius:var(--rs);padding:3px;gap:2px}
.seg button{flex:1;min-height:calc(var(--ctl) - 6px);border:0;border-radius:5px;background:transparent;font-weight:700;color:var(--ink2);font-size:calc(var(--fs-ctl) - 1px);padding:0 10px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
:root[data-theme="dark"] .seg button.on{background:#2E2E33}
.empty{text-align:center;color:var(--ink2);padding:40px 20px}
.empty b{display:block;font-size:var(--fs-h2);color:var(--ink);margin-bottom:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:calc(var(--fs-ctl) - 1px);border:1px solid var(--line);background:var(--surface);border-radius:var(--rs);min-height:var(--chip);padding:0 12px}
.toggle i{width:30px;height:18px;border-radius:9px;background:var(--surface2);position:relative;transition:.15s;flex:none}
.toggle i::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--ink3);transition:.15s}
.toggle.on i{background:var(--accent)} .toggle.on i::after{left:14px;background:#fff}

/* ---------- napló: kártyák ---------- */
.dayhead{font-size:var(--fs-label);font-weight:800;color:var(--ink2);margin:18px 4px 6px;display:flex;justify-content:space-between;gap:10px}
.dayhead .num{font-weight:700;color:var(--ink3)}
.loggrid{display:grid;grid-template-columns:1fr;gap:6px}
@media (min-width:700px){.loggrid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}}
.pcard{padding:9px 12px 9px 14px;display:block;width:100%;text-align:left;position:relative;overflow:hidden}
.pcard:hover{border-color:var(--ink3)}
.pcard .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.pcard .m{font-weight:800;font-size:var(--fs-h3);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .c{color:var(--ink2);font-size:var(--fs-label);margin-top:1px;display:flex;align-items:center;gap:6px}
.meta{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:6px;font-size:var(--fs-label);color:var(--ink2);align-items:center}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg.i{width:15px;height:15px}
.runcard{padding:10px 12px;margin-bottom:6px;border-left:4px solid var(--st-fut-bar)}
.runcard.wait{border-left-color:var(--st-felv-bar)}
.runcard .acts{display:flex;gap:6px;margin-top:8px}

/* ---------- napló: lista ---------- */
.ltable{overflow:hidden}
.logtable{overflow-x:auto;overscroll-behavior-x:contain}
.logtable.custom .lrow{width:max-content;min-width:100%}
.lrow{display:grid;grid-template-columns:var(--lcols);gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;font-size:calc(var(--fs-ctl) - 1px)}
.lrow:last-child{border-bottom:0}
button.lrow:hover{background:var(--accent-tint)}
.lrow.head{font-size:calc(var(--fs-small) - 1px);font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);background:var(--surface2);padding-top:6px;padding-bottom:6px}
.lrow .r{text-align:right}
.lrow .mdl{font-weight:700;font-size:var(--fs-h3)}
.lrow.head .hc{position:relative;align-items:center;min-width:0}
.lrow.head .hc:not(.wide){display:flex}
.rz{position:absolute;right:-8px;top:-6px;bottom:-6px;width:12px;cursor:col-resize;z-index:2;display:none}
.rz::after{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.rz:hover::after{background:var(--accent)}
.lrow.first{border-top:2px solid var(--line)}
.dcell{display:flex;flex-direction:column;line-height:1.25;align-self:center}
.dcell b{font-weight:800}
.dcell span{font-size:var(--fs-small);color:var(--ink3)}
.dayblock{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;margin-top:14px}
.dayblock>.dcell{position:sticky;top:0;padding-top:6px}
@media (min-width:900px){.dayblock{grid-template-columns:140px minmax(0,1fr)}}
.wraptext .ell{white-space:normal;overflow:visible}
.wraptext .pcard .m{-webkit-line-clamp:unset;display:block}

.lrow .sub{font-size:var(--fs-small);color:var(--ink3);display:flex;align-items:center;gap:5px}
.lrow .cell{display:flex;align-items:center;gap:6px;min-width:0}
.ltable{--lcols:minmax(0,1fr) 16px 54px 46px}
.ltable.dl{--lcols:72px minmax(0,1fr) 16px 54px 46px}
.ltable .mt{display:none}
.ltable .wide{display:none}
@media (min-width:900px){
  .ltable{--lcols:var(--lcols-custom, minmax(0,2.3fr) minmax(0,1.6fr) minmax(0,1.5fr) 52px 74px 64px 56px 84px 84px)}
  .ltable.dl{--lcols:128px var(--lcols-custom, minmax(0,2.3fr) minmax(0,1.6fr) minmax(0,1.5fr) 52px 74px 64px 56px 84px 84px)}
  .rz{display:block}
  .ltable .wide{display:flex}
  .ltable .mt{display:inline}
  .ltable .narrow{display:none}
}
.dayrow{padding:6px 12px;font-size:var(--fs-small);font-weight:800;color:var(--ink2);background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}

/* ---------- készlet ---------- */
.tgrid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.tgrid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}}
.tcard{padding:12px 14px}
.tcard .big{font-size:var(--fs-num);font-weight:850;letter-spacing:-.01em;line-height:1.1}
.tcard .big small{font-size:calc(var(--fs-ctl) - 1px);font-weight:700;color:var(--ink2);margin-left:3px}
.tcard.empty-stock{opacity:.75}
.stable{--scols:minmax(0,1fr) 76px 92px}
.stable .wide{display:none}
@media (min-width:900px){
  .stable{--scols:minmax(0,1.6fr) 100px minmax(0,1.2fr) 96px 90px 70px 104px}
  .stable .wide{display:flex}
  .stable .barcell{display:block}
}
.stable .lrow{grid-template-columns:var(--scols)}
.list{padding:2px 0}
.li{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:calc(var(--fs-ctl) - 1px)}
.li:last-child{border-bottom:0}

/* ---------- projektek ---------- */
.pgrid{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
@media (min-width:1100px){.pgrid{grid-template-columns:1fr 1fr}}
.gcard{padding:4px 0 6px}
.ghead{display:flex;align-items:center;gap:8px;padding:10px 14px 4px}
.ghead h3{margin:0;font-size:var(--fs-h3);font-weight:850;flex:1}
.item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 14px}
.item:hover{background:var(--accent-tint)}
.item .top{display:flex;align-items:baseline;gap:8px;margin-bottom:5px;font-size:calc(var(--fs-ctl) - 1px)}
.item .nm{font-weight:700;flex:1;min-width:0}
.item .st{font-weight:800;font-size:var(--fs-label);white-space:nowrap}
.item .sub{font-size:var(--fs-small);color:var(--ink3);margin-top:4px}
.addrow{padding:4px 10px 2px}

/* ---------- kalibráció ---------- */
.cgrid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:800px){.cgrid{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}}
.ccard{padding:12px 14px;display:block;width:100%;text-align:left}
.ccard:hover{border-color:var(--ink3)}
.rate{min-width:42px;height:42px;border-radius:var(--rs);display:grid;place-items:center;font-weight:850;font-size:var(--fs-p);background:var(--accent-tint);color:var(--accent)}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.notes{white-space:pre-wrap;font-size:var(--fs-label);color:var(--ink2);padding:12px 14px;line-height:1.5}
.notes+.notes{border-top:1px solid var(--line)}

/* ---------- statisztika ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:900px){.kpis{grid-template-columns:repeat(6,1fr)}}
.kpi{padding:10px 14px}
.kpi .l{font-size:var(--fs-small);color:var(--ink2);font-weight:700}
.kpi .v{font-size:calc(var(--fs-num) - 2px);font-weight:850;letter-spacing:-.01em}
.kpi .v small{font-size:var(--fs-label);color:var(--ink2);font-weight:700;margin-left:3px}
.kpi .s{font-size:var(--fs-small);color:var(--ink3)}
.sgrid{display:grid;grid-template-columns:1fr;gap:0 14px}
@media (min-width:1000px){.sgrid{grid-template-columns:1fr 1fr}}
.hbar{padding:7px 14px}
.hbar .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px;font-size:calc(var(--fs-ctl) - 1px)}
.hbar .top b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart{padding:12px 10px 6px}
.chart svg{width:100%;height:auto;display:block;max-width:900px;max-height:260px;margin:0 auto}
.chart text{fill:var(--ink3);font-size:calc(var(--fs-small) - 1px);font-family:inherit}

/* ---------- lapok (űrlapok) ---------- */
#sheets{position:fixed;inset:0;z-index:50;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(10,10,20,.4);opacity:0;transition:opacity .2s;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 20px);background:var(--bg);border-radius:14px 14px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1);pointer-events:auto;overflow:hidden}
.sheet.in{transform:none} .scrim.in{opacity:1}
.sheet.small{top:auto;max-height:85%}
.sh-head{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 18px;border-bottom:1px solid var(--line)}
.sh-head h2{flex:1;margin:0;font-size:var(--fs-h2);font-weight:850}
.sh-body{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:4px 16px 20px}
.sh-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;background:var(--bg)}
.sh-foot .btn{flex:1;min-height:48px;font-size:var(--fs-p)}
@media (min-width:900px){
  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:min(1120px,94vw);max-height:94vh;border-radius:14px;transform:translate(-50%,-48%);opacity:0;transition:transform .18s,opacity .18s}
  .sheet.in{transform:translate(-50%,-50%);opacity:1}
  .sheet.small{width:min(560px,94vw)}
  .sheet.mid{width:min(760px,94vw)}
  .sh-body{padding:4px 22px 18px}
  .sh-foot{justify-content:flex-end;padding:10px 22px}
  .sh-foot .btn{flex:none;min-width:150px;min-height:42px;font-size:var(--fs-ctl)}
}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 28px}
.fgrid>*{min-width:0}
@media (min-width:900px){.fgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.f{margin-top:12px}
.f>label,.lab{display:flex;align-items:center;gap:8px;font-weight:800;font-size:var(--fs-label);color:var(--ink2);margin:0 1px 5px}
.lab .lnk{margin-left:auto;border:0;background:transparent;color:var(--accent);font-weight:700;font-size:var(--fs-label);padding:2px 4px;display:inline-flex;align-items:center;gap:5px}
.inp{width:100%;min-height:var(--ctl);border:1px solid var(--line);border-radius:var(--rs);background:var(--surface);padding:6px 12px;font-size:var(--fs-ctl);outline:0}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
textarea.inp{min-height:84px;resize:vertical;overscroll-behavior:contain;line-height:1.4}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.three{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.two>*,.three>*{min-width:0}
.unit{position:relative}
.unit .inp{padding-right:38px}
.unit em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--ink3);font-weight:700;pointer-events:none}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--rs);background:var(--surface);overflow:hidden;min-height:var(--ctl)}
.stepper button{width:var(--ctl);height:calc(var(--ctl) - 2px);border:0;background:transparent;font-size:calc(var(--fs-h2) + 2px);font-weight:600;flex:none;color:var(--ink2)}
.stepper button:hover{background:var(--surface2)}
.stepper input{flex:1;min-width:0;border:0;background:transparent;text-align:center;font-size:var(--fs-p);font-weight:800;outline:0;height:calc(var(--ctl) - 2px)}
.hint{margin-top:8px;padding:8px 12px;border-radius:var(--rs);background:var(--surface2);font-size:var(--fs-label);color:var(--ink2);line-height:1.4;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hint.acc{background:var(--accent-tint);color:var(--ink)}
.hint.warn{background:var(--wait-soft);color:var(--ink)}
.hint.bad{background:var(--bad-soft);color:var(--ink)}
.sugg{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.sugg button{text-align:left;border:0;background:var(--surface2);border-radius:var(--rs);min-height:38px;padding:6px 12px;font-size:calc(var(--fs-ctl) - 1px)}
.sugg button:hover{background:var(--accent-tint)}
.sugg button small{display:block;color:var(--ink3);font-size:var(--fs-small)}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.palette button{width:28px;height:28px;border-radius:6px;border:2px solid transparent;padding:0}
.palette button.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--bg)}
.palette button.none{background:var(--surface);border:1px dashed var(--ink3);display:grid;place-items:center;color:var(--ink3)}
.palette button.none.on{border:2px solid var(--ink)}
.pip{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink2);cursor:pointer;position:relative;overflow:hidden}
.pip svg.i{width:16px;height:16px}
.pip.on{border:2px solid var(--ink);box-shadow:inset 0 0 0 2px var(--bg)}
.pip input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.pcrow{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pcrow .nm{flex:1;min-width:160px;font-weight:700;display:flex;align-items:center;gap:8px}

/* ---------- toast ---------- */
#toast{width:max-content;position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translate(-50%,14px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--r);font-weight:700;font-size:calc(var(--fs-ctl) - 1px);opacity:0;transition:.22s;z-index:90;max-width:min(92vw,560px);text-align:center;pointer-events:none}
#toast.in{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){#toast{bottom:32px}}
.filebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border:1.5px dashed var(--accent-soft);border-radius:var(--r);background:var(--accent-tint)}
.filehint{margin-top:10px;align-items:flex-start}

/* ---------- apróságok ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf1 = new Intl.NumberFormat('hu-HU', {maximumFractionDigits:1});
const nf0 = new Intl.NumberFormat('hu-HU', {maximumFractionDigits:0});
const g = v => nf1.format(Math.round((+v||0)*10)/10);
const g0 = v => nf0.format(Math.round(+v||0));
const low = s => String(s ?? '').trim().toLocaleLowerCase('hu');
const num = v => { const n = parseFloat(String(v ?? '').replace(/\s/g,'').replace(',','.')); return isNaN(n) ? 0 : n; };
const hm = h => { const t = Math.round((+h||0)*60); return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`; };
function isoToday(off=0){ const d = new Date(); d.setDate(d.getDate()+off); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function dayLabel(iso){
  if (!iso) return 'Dátum nélkül';
  if (iso === isoToday()) return 'Ma';
  if (iso === isoToday(-1)) return 'Tegnap';
  const [y,m,d] = iso.split('-').map(Number);
  return new Intl.DateTimeFormat('hu-HU',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date(y,m-1,d));
}
function shortDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-').map(Number); return new Intl.DateTimeFormat('hu-HU',{year:'numeric',month:'short',day:'numeric'}).format(new Date(y,m-1,d)); }
function wild(pattern, value){
  const re = new RegExp('^' + low(pattern).replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.') + '$');
  return re.test(low(value));
}
function printerShort(p){
  if (!p) return '';
  const t = p.split(/\s+/);
  if (/ENDER|KE/i.test(p) && t.length > 1) return 'KE ' + t[t.length-1];
  return t[t.length-1];
}
const COLORS = [
  [/feh[eé]r|white|nat[uú]r/,'#f7f7f4'],[/fekete|black/,'#1d1d1e'],[/barna|chocolate|brown|csoki/,'#5b3a27'],
  [/piros|red/,'#d93a40'],[/arany|gold/,'#d1a53a'],[/ez[uü]st|silver/,'#b9bcc2'],[/k[eé]k|blue/,'#0076f7'],
  [/z[oö]ld|green/,'#2d9a58'],[/s[aá]rga|yellow/,'#ebea76'],[/narancs|orange/,'#ef7a22'],[/sz[uü]rke|grey|gray/,'#8b8b8b'],
  [/lila|purple|violet/,'#7c55c4'],[/r[oó]zsasz|pink/,'#e88db3'],[/mystic|silk|rainbow|sziv[aá]rv/,'linear-gradient(135deg,#0076f7,#ef7a22,#2d9a58)']
];
function swatch(color, mat=''){
  const s = low(color + ' ' + mat);

  return `<i class="sw" style="background:var(--surface2)"></i>`;
}
/* projektszínek – a palettához illő árnyalatok */
const PALETTE = ['#0076F7','#B2D6FD','#8AD3D3','#284949','#EBEA76','#1D1D1E','#F08A6C','#F5B85C','#7FC98F','#B49CF0','#EF9AC2','#9A9AA4'];
const projColor = name => (D().meta?.projectColors || {})[low(name)] || '';

/* =====================================================================
   KAPCSOLAT A TÁBLÁZATTAL
   ===================================================================== */
class NetErr extends Error {}
async function api(action, data){
  if (!S.cfg.url || !S.cfg.key) throw new Error('Még nincs beállítva a táblázat címe és jelszava (Beállítások).');
  const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 45000);
  let res;
  try {
    res = await fetch(S.cfg.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({key:S.cfg.key, action, data}), signal:ctrl.signal, redirect:'follow'});
  } catch(e){ throw new NetErr('Nem érem el a táblázatot (nincs net?)'); }
  finally { clearTimeout(to); }
  let j;
  try { j = await res.json(); } catch(e){ throw new Error('Furcsa választ kaptam. Biztos jó a webcím? (A „/exec” végűt kell beírni.)'); }
  if (!j.ok) throw new Error(j.error || 'Ismeretlen hiba');
  return j.data;
}
function setSync(state, msg=''){
  const el = $('#sync'); el.className = state === 'ok' || state === 'idle' ? '' : state;
  $('#synctxt').textContent = msg; el.title = msg;
}
function takeData(d){ if (!d || !d.log) return; S.data = d; store.set('cache', d); }
async function refresh(silent){
  if (!S.cfg.url) { render(); return; }
  setSync('busy', '');
  try {
    await flushOutbox();
    takeData(await api('getAll'));
    setSync('ok', S.outbox.length ? `${S.outbox.length} vár` : '');
    if (!silent) toast('Friss adatok a táblázatból ✓');
  } catch(e){
    setSync(e instanceof NetErr ? 'off' : 'err', e instanceof NetErr ? 'Offline' : 'Hiba');
    if (!silent || !(e instanceof NetErr)) toast(e.message);
  }
  render();
}
const QUEUEABLE = ['addPrint','addDelivery'];
async function write(action, data, okMsg){
  setSync('busy', '');
  try {
    takeData(await api(action, data));
    setSync('ok', S.outbox.length ? `${S.outbox.length} vár` : '');
    toast(okMsg || 'Mentve a táblázatba ✓');
    render();
    return true;
  } catch(e){
    if (e instanceof NetErr && QUEUEABLE.includes(action)){
      S.outbox.push({action, data, at:Date.now()}); store.set('outbox', S.outbox);
      setSync('off', `${S.outbox.length} vár`);
      toast('Nincs net – elmentettem, és elküldöm, amint lesz kapcsolat.');
      render();
      return true;
    }
    setSync(e instanceof NetErr ? 'off' : 'err', e instanceof NetErr ? 'Offline' : 'Hiba');
    alertBox('Nem sikerült menteni', e.message);
    return false;
  }
}
let flushing = false;
async function flushOutbox(){
  if (flushing || !S.outbox.length) return;
  flushing = true;
  try {
    while (S.outbox.length){
      const it = S.outbox[0];
      try { takeData(await api(it.action, it.data)); }
      catch(e){
        if (e instanceof NetErr) throw e;
        alertBox('Egy várakozó rögzítést a táblázat visszautasított', `${e.message}\n\n(${it.data.model || it.data.brand || ''}) – ezt kérlek, rögzítsd újra.`);
      }
      S.outbox.shift(); store.set('outbox', S.outbox);
    }
    toast('A várakozó rögzítések elküldve ✓');
  } finally { flushing = false; }
}
window.addEventListener('online', () => refresh(true));

const D = () => S.data || {log:[], projects:[], stock:{trackers:[], deliveries:[]}, cal:{notes:[], rows:[]}, meta:{}};
function pendingPrints(){ return S.outbox.filter(o => o.action === 'addPrint').map((o,i) => Object.assign({pending:true, row:'p'+i}, o.data)); }
function sortedLog(){
  return D().log.concat(pendingPrints()).slice().sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.pending?1:0)-(a.pending?1:0) || (+b.row||0)-(+a.row||0));
}
function recent(field, filter, n=8){
  const seen = new Set(), out = [];
  for (const r of sortedLog()){
    if (filter && !filter(r)) continue;
    const v = typeof field === 'function' ? field(r) : r[field];
    if (!v || seen.has(low(v))) continue;
    seen.add(low(v)); out.push(v);
    if (out.length >= n) break;
  }
  return out;
}
function allDistinct(field){ const m = new Map(); for (const r of D().log){ const v = r[field]; if (v && !m.has(low(v))) m.set(low(v), v); } return [...m.values()].sort((a,b)=>a.localeCompare(b,'hu')); }
function projItems(){ const out = []; D().projects.forEach(gr => gr.items.forEach(it => out.push(Object.assign({group: gr.name}, it)))); return out; }
function projMatch(model){ const m = low(model); return m ? projItems().filter(it => low(it.crit) === m) : []; }
function trackerFor(mat, color){ return D().stock.trackers.find(t => t.logMat && low(t.logMat) === low(mat) && wild(t.logColor, color)); }
function delivMatch(dv, d){ return dv && low(dv.brand)===low(d.brand) && low(dv.type)===low(d.type) && low(dv.spec)===low(d.spec||'Basic') && low(dv.color)===low(d.color); }
function deliveredFor(t){ if (!t.deliv) return null; return D().stock.deliveries.filter(d => delivMatch(t.deliv, d)).reduce((s,d)=>s+d.grams,0); }
/* 0 g vagy kevesebb = Elfogyott (piros); a beállított határ alatt = Fogyóban (sárga) */
function stockLevel(t){ return t.avail <= 0.05 ? 'bad' : t.avail < (+S.cfg.lowG||0) ? 'warn' : 'ok'; }

/* ---------- Projektek ---------- */
function itemState(it){
  if (typeof it.left === 'string') {
    if (/kész/i.test(it.left)) return {cls:'ok', t:'Kész!'};
    const m = it.left.match(/(\d+)/); return {cls:'acc', t: m ? `+${m[1]} extra` : it.left};
  }
  if (!it.ordered) return {cls:'', t:'—'};
  return it.left <= 0 ? {cls:'ok', t:'Kész!'} : {cls:'', t:`Hátravan ${g0(it.left)}`};
}
function groupDone(gr){ return gr.items.length && gr.items.every(it => ['ok','acc'].includes(itemState(it).cls)); }
function viewProj(){
  const groups = D().projects.slice().reverse();
  const shown = S.projFilter === 'active' ? groups.filter(gr => !groupDone(gr)) : groups;
  let html = `<div class="toolbar"><div class="seg">
      <button class="${S.projFilter==='active'?'on':''}" data-act="projFilter" data-v="active">Folyamatban (${groups.filter(x=>!groupDone(x)).length})</button>
      <button class="${S.projFilter==='all'?'on':''}" data-act="projFilter" data-v="all">Mind (${groups.length})</button></div>
      <div class="grow"></div><button class="btn deskonly" data-act="newProject">${icon('plus')} Új projekt</button></div>`;
  if (!shown.length) return html + `<div class="empty"><b>${groups.length ? 'Minden kész! 🎉' : 'Nincs még projekt'}</b>${groups.length ? 'Minden rendelt darab legyártva.' : 'Hozz létre egyet a + gombbal.'}</div>`;
  html += `<div class="pgrid">` + shown.map(gr => {
    const ord = gr.items.reduce((s,i)=>s+(i.ordered||0),0), done = gr.items.reduce((s,i)=>s+Math.min(i.done||0, i.ordered||0),0);
    const pct = ord ? Math.round(done/ord*100) : 0, gi = D().projects.indexOf(gr), solo = !gr.name && gr.items.length === 1;
    return `<div class="card gcard">

      ${gr.items.map(it => {

/* ---------- Statisztika ---------- */
function periodRange(p){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const f = (Y,M,Dd) => `${Y}-${String(M+1).padStart(2,'0')}-${String(Dd).padStart(2,'0')}`;
  if (p === 'month') return [f(y,m,1), f(y,m,31)];
  if (p === 'prev') { const d = new Date(y, m-1, 1); return [f(d.getFullYear(), d.getMonth(), 1), f(d.getFullYear(), d.getMonth(), 31)]; }
  if (p === 'year') return [`${y}-01-01`, `${y}-12-31`];
  if (p === 'lastyear') return [`${y-1}-01-01`, `${y-1}-12-31`];
  return ['0000', '9999'];
}
function sumBy(rows, key, val){ const m = new Map(); rows.forEach(r => { const k = (typeof key==='function'?key(r):r[key]) || '—'; m.set(k, (m.get(k)||0) + val(r)); }); return [...m.entries()].sort((a,b)=>b[1]-a[1]); }
function hbars(entries, fmt, max=8, dot){
  const top = entries.slice(0, max), mx = Math.max(...top.map(e=>e[1]), 1);
  return top.map(([k,v]) => `<div class="hbar"><div class="top"><b class="row" style="gap:6px">${dot?dot(k):''}<span class="ell">${esc(k)}</span></b><span class="num muted">${fmt(v)}</span></div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join('') || `<div class="hbar muted">Nincs adat</div>`;
}
function monthChart(rows){
  const now = new Date(), months = [];
  for (let i = 11; i >= 0; i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); }
  const metric = S.statMetric;
  const vals = months.map(mo => rows.filter(r => (r.date||'').startsWith(mo)).reduce((s,r) => s + (metric==='hours' ? r.hours||0 : (r.g||0)+(r.waste||0)), 0));
  const mx = Math.max(...vals, 1), W = 760, H = 220, bw = W/12;
  const names = ['jan','feb','már','ápr','máj','jún','júl','aug','szep','okt','nov','dec'];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Havi bontás">${vals.map((v,i) => {
    const h = v/mx*(H-50), x = i*bw + bw*0.2, y = H-26-h, cur = i===11;
    const lab = metric==='hours' ? Math.round(v) : (v>=1000 ? nf1.format(v/1000)+'k' : Math.round(v));
    return `<rect x="${x}" y="${y}" width="${bw*0.6}" height="${Math.max(h,1)}" rx="4" fill="${cur?'var(--accent)':'var(--accent-soft)'}"/>
      ${v ? `<text x="${x+bw*0.3}" y="${y-6}" text-anchor="middle">${lab}</text>` : ''}
      <text x="${x+bw*0.3}" y="${H-6}" text-anchor="middle">${names[+months[i].slice(5)-1]}</text>`;
  }).join('')}</svg>`;
}
function viewStats(){
  const all = D().log, [from, to] = periodRange(S.statPeriod);
  const rows = all.filter(r => r.date >= from && r.date <= to);
  const hours = rows.reduce((s,r)=>s+(r.hours||0),0), grams = rows.reduce((s,r)=>s+(r.g||0),0), waste = rows.reduce((s,r)=>s+(r.waste||0),0);
  const pcs = rows.reduce((s,r)=>s+(r.pcs||0),0), bad = rows.filter(r => r.status === 'Rossz').length;
  const P = [['month','Ez a hónap'],['prev','Előző hónap'],['year','Idén'],['lastyear','Tavaly'],['all','Mind']];
  let html = `<div class="chips scroll" style="margin:4px 0 12px">${P.map(([k,t]) => `<button class="chip ${S.statPeriod===k?'on':''}" data-act="statPeriod" data-v="${k}">${t}</button>`).join('')}</div>`;
  html += `<div class="kpis num">
    <div class="card kpi"><div class="l">Nyomtatási idő</div><div class="v">${g0(hours)}<small>óra</small></div><div class="s">${hm(hours)}</div></div>
    <div class="card kpi"><div class="l">Felhasznált anyag</div><div class="v">${grams+waste>=1000 ? nf1.format((grams+waste)/1000)+'<small>kg</small>' : g0(grams+waste)+'<small>g</small>'}</div><div class="s">hasznos ${g0(grams)} g</div></div>
    <div class="card kpi"><div class="l">Hulladék</div><div class="v">${g0(waste)}<small>g</small></div><div class="s">${grams+waste ? nf1.format(waste/(grams+waste)*100) : 0}% az összesből</div></div>
    <div class="card kpi"><div class="l">Nyomtatások</div><div class="v">${g0(rows.length)}<small>alk.</small></div><div class="s">${g0(pcs)} darab elem</div></div>
    <div class="card kpi"><div class="l">Sikertelen</div><div class="v" style="color:${bad?'var(--bad)':'inherit'}">${bad}<small>db</small></div><div class="s">${rows.length ? nf1.format(bad/rows.length*100) : 0}% arány</div></div>
    <div class="card kpi"><div class="l">Átlag / nyomtatás</div><div class="v">${rows.length ? hm(hours/rows.length) : '0:00'}</div><div class="s">${rows.length ? g0((grams+waste)/rows.length) : 0} g</div></div>
  </div>`;
  html += `<div class="sec-title">Elmúlt 12 hónap</div><div class="card chart">
    <div class="seg" style="margin:0 4px 10px;max-width:260px"><button class="${S.statMetric==='hours'?'on':''}" data-act="statMetric" data-v="hours">Óra</button><button class="${S.statMetric==='grams'?'on':''}" data-act="statMetric" data-v="grams">Gramm</button></div>
    ${monthChart(all)}</div>`;
  html += `<div class="sgrid">
    <div><div class="sec-title">Gépek – óra</div><div class="card list">${hbars(sumBy(rows,'printer',r=>r.hours||0), v=>hm(v))}</div></div>
    <div><div class="sec-title">Kliensek – gramm</div><div class="card list">${hbars(sumBy(rows,'client',r=>(r.g||0)+(r.waste||0)), v=>g0(v)+' g')}</div></div>
    <div><div class="sec-title">Anyagok – gramm</div><div class="card list">${hbars(sumBy(rows,r=>[r.mat,r.color].filter(Boolean).join(' · '),r=>(r.g||0)+(r.waste||0)), v=>g0(v)+' g')}</div></div>
    <div><div class="sec-title">Projektek – óra</div><div class="card list">${hbars(sumBy(rows,'project',r=>r.hours||0), v=>hm(v), 8, k => pdot(k))}</div></div>
  </div>`;
  return html;
}

let sheetSeq = 0;
function openSheet({title, body, foot='', size='', onMount, onClose}){
  const wrap = document.createElement('div');
  wrap.id = 'sh' + (++sheetSeq);
  wrap.innerHTML = `<div class="scrim"></div><div class="sheet ${size}" role="dialog" aria-modal="true">
    <div class="sh-head"><h2>${esc(title)}</h2><button class="iconbtn" data-close aria-label="Bezárás">${icon('x')}</button></div>
    <div class="sh-body">${body}</div>${foot ? `<div class="sh-foot">${foot}</div>` : ''}</div>`;
  $('#sheets').appendChild(wrap);
  $('#sheets').style.pointerEvents = 'auto';
  requestAnimationFrame(() => { wrap.querySelector('.scrim').classList.add('in'); wrap.querySelector('.sheet').classList.add('in'); });
  const close = () => {
    wrap.querySelector('.scrim').classList.remove('in'); wrap.querySelector('.sheet').classList.remove('in');
    setTimeout(() => { wrap.remove(); if (!$('#sheets').children.length) $('#sheets').style.pointerEvents = 'none'; }, 240);
    onClose && onClose();
  };
  pushBack(close);
  wrap.querySelector('.scrim').onclick = goBack;
  wrap.querySelector('[data-close]').onclick = goBack;
  const api = { el: wrap, body: wrap.querySelector('.sh-body'), foot: wrap.querySelector('.sh-foot'), close: goBack };
  onMount && onMount(api);
  return api;
}
function alertBox(title, msg){
  openSheet({title, size:'small', body:`<p style="white-space:pre-line;margin:14px 0">${esc(msg)}</p>`, foot:`<button class="btn primary" data-close2>Rendben</button>`,
    onMount: s => s.foot.querySelector('[data-close2]').onclick = goBack});
}

/* =====================================================================
   SZELETELT FÁJLOK BEOLVASÁSA (.gcode – Creality/Orca/Prusa, .gcode.3mf – Bambu Studio)
   Csak a fájl elejét/végét és a 3MF kis összefoglaló részeit olvassuk, a nagy
   G-kódot nem – így a 10–30 MB-os fájlok is azonnal betöltődnek.
   ===================================================================== */
const SLICE = {
  hms(s){                                   // "1d 2h 10m 50s" → óra
    let h = 0; const re = /(\d+(?:\.\d+)?)\s*([dhms])/g; let m;
    while ((m = re.exec(String(s)))) h += +m[1] * ({d:24, h:1, m:1/60, s:1/3600})[m[2]];
    return h;
  },
  first(v){ return String(v ?? '').split(/[;,]/)[0].replace(/^"|"$/g,'').trim(); },
  kv(text){                                 // "; kulcs = érték" és "; kulcs: érték" sorok
    const o = {};
    for (const line of text.split(/\r?\n/)){
      const m = line.match(/^;\s*([^=:]+?)\s*(?:=|:)\s*(.*)$/);
      if (m && !(m[1] in o)) o[m[1].trim()] = m[2].trim();
    }
    return o;
  },
  async readSlice(file, start, end){ return await file.slice(Math.max(0,start), Math.min(file.size, end)).text(); },
  cleanName(fname){
    return fname.replace(/\.(gcode\.3mf|3mf|gcode|gco|bgcode)$/i, '')
      .replace(/[_ ](PLA|PETG|ABS|ASA|TPU|PC|PA|PLA\+)(?=[_ .]|$).*$/i, '')       // "_PLA_2h11m" levágása
      .replace(/_\d+h\d+m.*$/i, '').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim();
  },

  async gcode(file){
    const head = await SLICE.readSlice(file, 0, 200000);
    const tail = await SLICE.readSlice(file, file.size - 400000, file.size);
    const kv = Object.assign({}, SLICE.kv(tail), SLICE.kv(head));
    // idő
    let hours = 0;
    const tm = (head + '\n' + tail).match(/estimated printing time[^=\n]*=\s*([^\n]+)/i)
            || head.match(/total estimated time:\s*([^\n;]+)/i)
            || (head + tail).match(/;\s*TIME:\s*(\d+)/);
    if (tm) hours = /^\d+$/.test(tm[1].trim()) ? +tm[1] / 3600 : SLICE.hms(tm[1]);
    // tömeg
    const gm = tail.match(/total filament used \[g\]\s*=\s*([\d.]+)/i) || tail.match(/filament used \[g\]\s*=\s*([\d.,\s]+)/i)
            || head.match(/total filament weight \[g\]\s*:\s*([\d.]+)/i);
    const grams = gm ? String(gm[1]).split(/[,\s]+/).filter(Boolean).reduce((s,x)=>s+(+x||0),0) : 0;
    const objs = [...tail.matchAll(/EXCLUDE_OBJECT_ID[^\n]*NAME=([^\s]+)/g)].map(m => m[1]);
    return [{
      source: file.name, kind: 'gcode',
      model: SLICE.cleanName(file.name),
      hours, grams,
      printerModel: (kv.printer_model || kv.printer_settings_id || '').replace(/"/g,''),
      matType: SLICE.first(kv.filament_type), vendor: SLICE.first(kv.filament_vendor),
      filamentName: SLICE.first(kv.filament_settings_id), colorHex: SLICE.first(kv.filament_colour),
      layer: kv.layer_height, infill: kv.sparse_infill_density || kv.fill_density,
      support: /^(1|true)$/i.test(kv.enable_support || kv.support_material || ''),
      brim: kv.brim_type || '', objects: objs.length
    }];
  },

  /* --- minimális ZIP-olvasó (a 3MF egy ZIP) --- */
  async zipIndex(file){
    const tailLen = Math.min(file.size, 70000);
    const buf = new DataView(await file.slice(file.size - tailLen).arrayBuffer());
    let eocd = -1;
    for (let i = buf.byteLength - 22; i >= 0; i--) if (buf.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('Ez nem tűnik érvényes .3mf fájlnak.');
    const cdSize = buf.getUint32(eocd + 12, true), cdOff = buf.getUint32(eocd + 16, true);
    const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());
    const dec = new TextDecoder(), out = {};
    for (let p = 0; p + 46 <= cd.byteLength && cd.getUint32(p, true) === 0x02014b50; ){
      const method = cd.getUint16(p + 10, true), csize = cd.getUint32(p + 20, true);
      const nlen = cd.getUint16(p + 28, true), xlen = cd.getUint16(p + 30, true), clen = cd.getUint16(p + 32, true);
      const lho = cd.getUint32(p + 42, true);
      const name = dec.decode(new Uint8Array(cd.buffer, cd.byteOffset + p + 46, nlen));
      out[name] = { method, csize, lho };
      p += 46 + nlen + xlen + clen;
    }
    return out;
  },
  async zipText(file, entry){
    if (!entry) return '';
    const lh = new DataView(await file.slice(entry.lho, entry.lho + 30).arrayBuffer());
    const start = entry.lho + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    const blob = file.slice(start, start + entry.csize);
    if (entry.method === 0) return await blob.text();
    if (entry.method !== 8 || !window.DecompressionStream) throw new Error('Ezt a tömörítést nem tudom kibontani.');
    return await new Response(blob.stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  },

  async threemf(file){
    const idx = await SLICE.zipIndex(file);
    const info = await SLICE.zipText(file, idx['Metadata/slice_info.config']);
    if (!info) throw new Error('Ebben a .3mf-ben nincs szeletelési adat. Bambu Studióban: Fájl → Exportálás → „Exportálás szeletelt fájlként” (.gcode.3mf).');
    const xml = new DOMParser().parseFromString(info, 'text/xml');
    const ms = new DOMParser().parseFromString(await SLICE.zipText(file, idx['Metadata/model_settings.config']) || '<config/>', 'text/xml');
    const model = await SLICE.zipText(file, idx['3D/3dmodel.model']);
    let ps = {}; try { ps = JSON.parse(await SLICE.zipText(file, idx['Metadata/project_settings.config']) || '{}'); } catch(e){}
    const meta = (el, k) => el.querySelector(`metadata[key="${k}"]`)?.getAttribute('value') || '';
    const title = (model.match(/<metadata name="Title">([^<]*)</) || [])[1] || '';
    const plateNames = {};
    ms.querySelectorAll('plate').forEach(p => plateNames[meta(p, 'plater_id')] = meta(p, 'plater_name'));
    const one = v => Array.isArray(v) ? v[0] : v;
    const plates = [...xml.querySelectorAll('plate')];
    const out = plates.map(p => {
      const id = meta(p, 'index');
      const fil = [...p.querySelectorAll('filament')];
      const used = fil.filter(f => +f.getAttribute('used_g') > 0);
      const main = (used.length ? used : fil).sort((a,b) => (+b.getAttribute('used_g')) - (+a.getAttribute('used_g')))[0];
      const fi = main ? (+main.getAttribute('id') - 1) : 0;
      const pick = arr => Array.isArray(arr) ? (arr[fi] ?? arr[0]) : arr;
      const base = title.replace(/&amp;/g,'&') || SLICE.cleanName(file.name);
      const pn = plateNames[id] || '';
      return {
        source: file.name, kind: '3mf', plate: id, plateName: pn,
        model: plates.length > 1 && pn ? `${base} – ${pn}` : base,
        hours: (+meta(p, 'prediction') || 0) / 3600,
        grams: +meta(p, 'weight') || fil.reduce((s,f) => s + (+f.getAttribute('used_g')||0), 0),
        printerModel: ps.printer_model || ps.printer_settings_id || '',
        matType: main?.getAttribute('type') || one(ps.filament_type) || '',
        vendor: pick(ps.filament_vendor) || '', filamentName: pick(ps.filament_settings_id) || '',
        colorHex: main?.getAttribute('color') || pick(ps.filament_colour) || '',
        layer: ps.layer_height, infill: ps.sparse_infill_density,
        support: meta(p, 'support_used') === 'true' || ps.enable_support === '1',
        brim: ps.brim_type || '', objects: p.querySelectorAll('object').length,
        extraFilaments: used.length > 1 ? used.map(f => `${f.getAttribute('type')} ${f.getAttribute('color')} ${f.getAttribute('used_g')} g`) : []
      };
    });
    if (!out.length) throw new Error('Nem találtam szeletelt tálcát a fájlban.');
    return out;
  },

  async parse(file){
    const n = file.name.toLowerCase();
    if (n.endsWith('.3mf')) return SLICE.threemf(file);
    if (/\.(gcode|gco)$/.test(n)) return SLICE.gcode(file);
    throw new Error(`„${file.name}”: csak .gcode és .gcode.3mf fájlt tudok beolvasni.`);
  },

  /* --- a fájl adatait a táblázat nyelvére fordítjuk --- */
  HU_COLORS: [['Fehér','#ffffff'],['Fekete','#111111'],['Szürke','#8a8a8a'],['Ezüst','#c0c0c0'],['Piros','#d42a2a'],['Protópiros','#b3242c'],
    ['Narancs','#f07a22'],['Sárga','#f2d22e'],['Arany','#d1a53a'],['Zöld','#2d9a58'],['Kék','#2850e0'],['Világoskék','#7fb5f5'],
    ['Lila','#7c55c4'],['Rózsaszín','#ec8fb6'],['Barna','#6b4226'],['Bézs','#d9c3a0']],
  colorName(hex){
    const m = String(hex).match(/#?([0-9a-f]{6})/i); if (!m) return '';
    const rgb = h => [0,2,4].map(i => parseInt(h.slice(i,i+2),16));
    const a = rgb(m[1]); let best = '', bd = 1e9;
    for (const [n,h] of SLICE.HU_COLORS){ const b = rgb(h.slice(1)); const d = (a[0]-b[0])**2*0.3 + (a[1]-b[1])**2*0.59 + (a[2]-b[2])**2*0.11; if (d < bd){ bd = d; best = n; } }
    return best;
  },
  toEntry(j){
    const mats = allDistinct('mat'), printers = allDistinct('printer').filter(p => p !== 'Mindhárom');
    // gép: P2S / KE / ... a legutóbb használt egyező gép
    const tokens = String(j.printerModel).toUpperCase().split(/[\s\-]+/).filter(t => t.length >= 2 && !/^(LAB|BAMBU|CREALITY|NOZZLE|0\.4|V3)$/.test(t));
    const pr = recent('printer', r => tokens.some(t => String(r.printer).toUpperCase().includes(t)), 1)[0]
            || printers.find(p => tokens.some(t => p.toUpperCase().includes(t))) || '';
    // anyag: "Gyártó Típus", ha szerepel már a naplóban; különben a legutóbbi azonos típusú
    const cand = [j.vendor && `${j.vendor} ${j.matType}`, j.filamentName].filter(Boolean);
    let mat = mats.find(m => cand.some(c => low(c) === low(m))) || '';
    // szín: a fájl színéhez legközelebbi magyar név
    const cn = SLICE.colorName(j.colorHex);
    let color = cn;
    if (mat) {
      const colors = recent('color', r => low(r.mat) === low(mat), 50);
      color = colors.find(c => low(c) === low(cn)) || colors.find(c => low(c).includes(low(cn))) || cn;
    } else if (j.matType) {
      // ismeretlen gyártó: csak akkor tippelünk, ha van ugyanilyen típusú ÉS színű filament a naplóban
      const combo = recent(r => (new RegExp('\\b' + j.matType + '\\b', 'i').test(r.mat) && low(r.color) === low(cn)) ? r.mat + '\u0001' + r.color : '', null, 1)[0];
      if (combo) [mat, color] = combo.split('\u0001');
    }
    const lay = j.layer ? `${String(j.layer).replace(/0+$/,'').replace(/\.$/,'')} mm` : '';
    const settings = [lay, j.infill ? `${j.infill} infill` : '', /auto/i.test(j.brim) ? 'autobrim' : (/no_brim|none/i.test(j.brim) || !j.brim ? '' : 'brim')].filter(Boolean).join(', ');
    return {
      model: j.model, pcs: 1, g: Math.round(j.grams * 10) / 10, waste: 0, hours: j.hours,
      mat, color, printer: pr, settings, support: j.support ? 'Igen' : 'Nem', status: 'Fut',
      _file: Object.assign(j, {unknownMat: !mat})
    };
  }
};

/* fájlok → egymás után megnyíló, előre kitöltött „Új nyomtatás” lapok */
async function importSliceFiles(files){
  const jobs = [];
  for (const f of files){
    try { jobs.push(...await SLICE.parse(f)); }
    catch(e){ alertBox('Nem sikerült beolvasni', e.message || String(e)); }
  }
  if (!jobs.length) return;
  if (!S.data) { toast('Előbb kösd össze az appot a táblázattal (Beállítások).'); return; }
  const queue = jobs.map(SLICE.toEntry);
  if (queue.length > 1) toast(`${queue.length} nyomtatás a fájl(ok)ban – egymás után nyitom meg őket.`);
  openPrintForm(queue[0], 'file', queue.slice(1));
}
function pickSliceFiles(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true;
  inp.onchange = () => { if (inp.files.length) importSliceFiles([...inp.files]); };
  inp.click();
}
/* húzd-és-ejtsd bárhová az ablakon (PC) */
(() => {
  let depth = 0;
  const isFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
  document.addEventListener('dragenter', e => { if (!isFiles(e)) return; e.preventDefault(); if (++depth === 1) document.body.classList.add('dropping'); });
  document.addEventListener('dragover', e => { if (isFiles(e)) e.preventDefault(); });
  document.addEventListener('dragleave', e => { if (!isFiles(e)) return; if (--depth <= 0) { depth = 0; document.body.classList.remove('dropping'); } });
  document.addEventListener('drop', e => {
    if (!isFiles(e)) return;
    e.preventDefault(); depth = 0; document.body.classList.remove('dropping');
    const files = [...e.dataTransfer.files];
    if (!files.length) return;
    // ha egy nyitott „Új nyomtatás” lapra ejtették, azt töltjük ki; különben újat nyitunk
    const open = window.__fmFormFill;
    if (open) open(files); else importSliceFiles(files);
  });
})();

function pickSliceFilesInto(fill){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true;
  inp.onchange = () => { if (inp.files.length) fill([...inp.files]); };
  inp.click();
}
function fileHint(j, queue){
  const hx = /^#?[0-9a-f]{6}$/i.test(j.colorHex) ? (j.colorHex[0] === '#' ? j.colorHex : '#' + j.colorHex) : '';
  return `<div class="hint acc filehint">${icon('upload')}<div class="grow">
    <b>${esc(j.source)}</b>${j.plate ? ` · ${esc(j.plateName || (j.plate + '. tálca'))}` : ''}<br>
    <span class="small">${esc(j.printerModel)} · ${hx ? `<i class="sw" style="background:${hx};vertical-align:-2px"></i> ` : ''}${esc(j.filamentName || [j.vendor, j.matType].filter(Boolean).join(' '))} · <b class="num">${g(j.grams)} g</b> · <b class="num">${hm(j.hours)}</b>${j.objects > 1 ? ` · ${j.objects} objektum` : ''}</span>
    ${j.unknownMat ? `<br><span class="small"><b>A filamentet nem találtam a naplódban</b> – válaszd ki lent, melyik tekercsből nyomtatsz.</span>` : ''}
    ${j.extraFilaments?.length ? `<br><span class="small">Több filament: ${esc(j.extraFilaments.join(' · '))} – a legtöbbet használtat töltöttem be.</span>` : ''}
    ${queue.length ? `<br><span class="small"><b>Még ${queue.length} nyomtatás vár</b> – mentés után a következő magától megnyílik.</span>` : ''}
  </div></div>`;
}

  let fileInfo = mode === 'file' && src ? src._file : null;
  const pick = src ? Object.fromEntries(['client','project','model','pcs','g','waste','hours','mat','color','settings','support','printer'].concat(mode === 'file' ? ['status'] : []).filter(k => src[k] !== undefined && src[k] !== null).map(k => [k, src[k]])) : {};
  const F = mode === 'edit' ? Object.assign({}, src) : Object.assign({
    date: isoToday(), client: last.client||'', project: last.project||'', model:'', pcs:1, g:'', waste:0, hours:0,
    mat: last.mat||'', color: last.color||'', status:'Kész', settings:'', support:'Nem', printer: last.printer||''
  }, pick);
  F.H = Math.floor((+F.hours||0) + 1e-9); F.M = Math.round(((+F.hours||0) - F.H) * 60);
  if (F.M === 60) { F.H++; F.M = 0; }
  picker.open = {};
  picker.lists = { client: allDistinct('client'), project: allDistinct('project'), mat: allDistinct('mat'), color: allDistinct('color'), printer: allDistinct('printer') };
  const copies = () => recent(r => r.model, null, 10).map(mdl => sortedLog().find(r => r.model === mdl));

  const body = () => {
    const clients = recent('client', null, 6);
    const projects = recent('project', r => !F.client || low(r.client) === low(F.client), 6);
    const combos = recent(r => r.mat && (r.mat + '\u0001' + (r.color||'')), null, 6);
    const printers = recent('printer', r => r.printer !== 'Mindhárom', 4);
    const settings = recent('settings', r => (!F.printer || r.printer === F.printer) && r.settings && r.settings !== 'N/A', 4);
    const comboOn = c => { const [m,cl] = c.split('\u0001'); return low(m)===low(F.mat) && low(cl)===low(F.color); };
    const comboKnown = combos.some(comboOn);
    return `
    ${mode !== 'edit' ? `<div class="filebar">
        <button type="button" class="btn" data-loadfile>${icon('upload')} Fájl betöltése</button>
        <span class="small muted deskonly-i">vagy húzd ide a <b>.gcode</b> / <b>.gcode.3mf</b> fájlt</span>
        <span class="small muted mobonly-i"><b>.gcode</b> vagy <b>.gcode.3mf</b></span></div>` : ''}
    ${fileInfo ? fileHint(fileInfo, queue) : ''}
    ${mode === 'new' ? `<div class="f"><span class="lab">Gyors másolás egy korábbiból</span><div class="chips scroll">${copies().map((r,i) => `<button type="button" class="chip" data-copy="${i}">${pdot(r.project)}<span class="t" style="max-width:260px">${esc(r.model)}</span></button>`).join('')}</div></div>` : ''}
    <div class="fgrid"><div>
      <div class="f"><span class="lab">Dátum</span><div class="row" style="gap:6px">
        <input class="inp" type="date" data-field="date" value="${esc(F.date)}" style="flex:1">
        <button type="button" class="chip ${F.date===isoToday()?'on':''}" data-setdate="0">Ma</button>
        <button type="button" class="chip ${F.date===isoToday(-1)?'on':''}" data-setdate="-1">Tegnap</button></div></div>
      ${picker('client', 'Kliens', clients, F.client)}
      ${picker('project', 'Projekt', projects, F.project, {swatchFn: p => pdot(p), extra:`<button type="button" class="lnk" data-colors>${icon('palette')} Színek</button>`})}
      <div class="f"><label for="pf_model">Modell / elem neve</label>
        <textarea class="inp" id="pf_model" data-field="model" rows="2" style="min-height:58px" placeholder="pl. W1 kampó">${esc(F.model)}</textarea>
        <div id="pf_match"></div></div>
    </div><div>
      <div class="f"><div class="three">
        <div><span class="lab">Darab</span><div class="stepper"><button type="button" data-step="pcs" data-d="-1">−</button><input data-field="pcs" inputmode="numeric" value="${esc(F.pcs)}" class="num"><button type="button" data-step="pcs" data-d="1">+</button></div></div>
        <div><span class="lab">Tömeg</span><div class="unit"><input class="inp num" data-field="g" inputmode="decimal" value="${esc(F.g)}" placeholder="0"><em>g</em></div></div>
        <div><span class="lab">Hulladék</span><div class="unit"><input class="inp num" data-field="waste" inputmode="decimal" value="${esc(F.waste)}" placeholder="0"><em>g</em></div></div>
      </div></div>
      <div class="f"><span class="lab">Nyomtatási idő</span><div class="two">
        <div class="stepper"><button type="button" data-step="H" data-d="-1">−</button><input data-field="H" inputmode="numeric" value="${esc(F.H)}" class="num" aria-label="óra"><button type="button" data-step="H" data-d="1">+</button></div>
        <div class="stepper"><button type="button" data-step="M" data-d="-5">−</button><input data-field="M" inputmode="numeric" value="${esc(F.M)}" class="num" aria-label="perc"><button type="button" data-step="M" data-d="5">+</button></div>
      </div><div class="two small faint" style="text-align:center;margin-top:2px"><span>óra</span><span>perc</span></div></div>
      <div class="f"><span class="lab">Filament</span>
        <div class="chips">${combos.map(c => { const [m,cl] = c.split('\u0001'); return `<button type="button" class="chip ${comboOn(c)?'on':''}" data-combo="${esc(c)}">${swatch(cl,m)}<span class="t">${esc(m)} · ${esc(cl)}</span></button>`; }).join('')}
        <button type="button" class="chip add" data-pickother="combo">${icon('plus')} Új</button></div>
        ${!comboKnown || picker.open.combo ? `<div class="two" style="margin-top:6px">
          <div><input class="inp" data-field="mat" value="${esc(F.mat)}" placeholder="Anyag (pl. Alzament PETG)" list="dl_mat"><datalist id="dl_mat">${picker.lists.mat.map(o=>`<option value="${esc(o)}">`).join('')}</datalist></div>
          <div><input class="inp" data-field="color" value="${esc(F.color)}" placeholder="Szín (pl. Fehér)" list="dl_color"><datalist id="dl_color">${picker.lists.color.map(o=>`<option value="${esc(o)}">`).join('')}</datalist></div></div>` : ''}

      <div class="f"><div class="two">

        <div><span class="lab">Státusz</span><div class="seg">${['Kész','Fut','Felvéve','Rossz'].map(v => `<button type="button" class="${F.status===v?'on':''}" data-seg="status" data-v="${v}" style="padding:0 4px">${v}</button>`).join('')}</div></div>
      </div></div>
    </div></div>
    ${mode === 'edit' ? `<p class="small faint" style="margin:14px 2px 0">Törölni innen nem lehet, mert a sortörlés elcsúsztatná a táblázat képleteit. Ha valamit elrontottál, írd át, vagy állítsd „Rossz”-ra.</p>` : ''}`;
  };

  const derived = sh => {
    const m = projMatch(F.model);
    sh.body.querySelector('#pf_match').innerHTML = m.length ? m.map(it => `<div class="hint acc">${icon('box')} Beleszámít: <b>${esc(it.group || it.name)} › ${esc(it.name)}</b> — <span class="num">${g0(it.done)} / ${g0(it.ordered)} kész</span></div>`).join('')
      : (() => {
        const sug = F.model.trim() ? projItems().filter(it => low(it.crit).includes(low(F.model)) && low(it.crit) !== low(F.model)).slice(0,3)
                                   : projItems().filter(it => typeof it.left === 'number' && it.left > 0).slice(-3).reverse();
        return sug.length ? `<div class="sugg">${sug.map(it => `<button type="button" data-setmodel="${esc(it.crit)}">${esc(it.crit)}<small>${esc(it.group||'')}${typeof it.left === 'number' && it.left > 0 ? ` · hátravan ${g0(it.left)} db` : ''}</small></button>`).join('')}</div>` : '';
      })();
    const t = trackerFor(F.mat, F.color), use = num(F.g) + num(F.waste);
    sh.body.querySelector('#pf_stock').innerHTML = t ? `<div class="hint ${t.avail - use < 0 ? 'warn' : ''}">${swatch(F.color,F.mat)} Készleten: <b class="num">${g0(t.avail)} g</b>${use && mode !== 'edit' ? ` → e nyomtatás után kb. <b class="num">${g0(t.avail - use)} g</b>` : ''}</div>` : '';
  };

  // egy betöltött fájl kitölti a már nyitott lapot (a további tálcák/fájlok sorba kerülnek)
  let formSheet = null, formRerender = null;
  const fill = async files => {
    const list = Array.isArray(files) ? files : [files];
    const jobs = [];
    for (const f of list){ try { jobs.push(...await SLICE.parse(f)); } catch(e){ alertBox('Nem sikerült beolvasni', e.message || String(e)); } }
    if (!jobs.length) return;
    const entries = jobs.map(SLICE.toEntry), e0 = entries[0];
    ['model','pcs','g','waste','mat','color','printer','settings','support','status'].forEach(k => { if (e0[k] !== '' && e0[k] !== undefined) F[k] = e0[k]; });
    F.H = Math.floor(e0.hours + 1e-9); F.M = Math.round((e0.hours - F.H) * 60); if (F.M === 60) { F.H++; F.M = 0; }
    fileInfo = e0._file; queue = entries.slice(1).concat(queue); picker.open = {};
    formRerender && formRerender();
    toast(entries.length > 1 ? `Kitöltve az 1. nyomtatással – mentés után jön a többi (${entries.length - 1}).` : 'Kitöltve a fájlból – ellenőrizd, és mentsd.');
  };
  const save = async sh => {
    const data = {
      date: F.date, client: String(F.client||'').trim(), project: String(F.project||'').trim(), model: String(F.model||'').trim(),
      pcs: num(F.pcs), g: num(F.g), waste: num(F.waste), hours: num(F.H) + num(F.M)/60,
      mat: String(F.mat||'').trim(), color: String(F.color||'').trim(), status: F.status, settings: String(F.settings||'').trim(), support: F.support, printer: String(F.printer||'').trim()
    };
    if (!data.model) { toast('Add meg a modell nevét.'); sh.body.querySelector('#pf_model').focus(); return; }
    if (!data.g && data.status === 'Kész' && !data.waste) { toast('Add meg a tömeget (g).'); return; }
    const btn = sh.foot.querySelector('[data-save]'); btn.disabled = true;
    const ok = mode === 'edit'
      ? await write('updatePrint', Object.assign({row: src.row, expectModel: src.model}, data), 'Módosítva a táblázatban ✓')
      : await write('addPrint', data, 'Bekerült a naplóba ✓');
    if (ok) {
      goBack();
      if (queue.length) setTimeout(() => openPrintForm(queue[0], 'file', queue.slice(1)), 320);
    } else btn.disabled = false;
  };

  openSheet({
    title: mode === 'edit' ? 'Nyomtatás szerkesztése' : 'Új nyomtatás',
    onClose: () => { if (window.__fmFormFill === fill) window.__fmFormFill = null; },
    body: body(),
    foot: `${mode === 'edit' ? `<button class="btn" data-dup>${icon('copy')} Másolat újként</button>` : ''}<button class="btn primary" data-save>${icon('check')} Mentés</button>`,
    onMount: sh => {
      const rerender = () => { const st = sh.body.scrollTop; sh.body.innerHTML = body(); sh.body.scrollTop = st; derived(sh); };
      derived(sh);
      formSheet = sh; formRerender = rerender;
      if (mode !== 'edit') window.__fmFormFill = fill;
      sh.body.addEventListener('input', e => {
        const k = e.target.dataset.field; if (!k) return;
        F[k] = e.target.value;
        if (['model','g','waste','mat','color'].includes(k)) derived(sh);
      });
      sh.body.addEventListener('change', e => { if (['client','printer'].includes(e.target.dataset.field)) rerender(); });
      sh.body.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        const d = b.dataset;
        if (d.pick) { F[d.pick] = d.v; picker.open[d.pick] = false; rerender(); }
        else if (d.pickother) { picker.open[d.pickother] = true; if (d.pickother !== 'combo') F[d.pickother] = ''; rerender(); (sh.body.querySelector(`[data-picker="${d.pickother}"] input`) || sh.body.querySelector('[data-field="mat"]'))?.focus(); }
        else if (d.combo) { const [m,c] = d.combo.split('\u0001'); F.mat = m; F.color = c; picker.open.combo = false; rerender(); }
        else if (d.setdate !== undefined) { F.date = isoToday(+d.setdate); rerender(); }
        else if (d.step) { const v = Math.max(0, num(F[d.step]) + +d.d); F[d.step] = d.step === 'M' ? Math.min(59, v) : v; sh.body.querySelector(`[data-field="${d.step}"]`).value = F[d.step]; }
        else if (d.seg) { F[d.seg] = d.v; rerender(); }
        else if (d.setset) { F.settings = d.setset; sh.body.querySelector('[data-field="settings"]').value = d.setset; }
        else if (d.setmodel) { F.model = d.setmodel; sh.body.querySelector('#pf_model').value = d.setmodel; derived(sh); }
        else if (b.hasAttribute('data-colors')) openProjColors(rerender);
        else if (b.hasAttribute('data-loadfile')) pickSliceFilesInto(fill);
        else if (d.copy !== undefined) {
          const r = copies()[+d.copy]; if (!r) return;
          Object.assign(F, {client:r.client, project:r.project, model:r.model, pcs:r.pcs, g:r.g, waste:0, mat:r.mat, color:r.color, settings:r.settings, support:r.support, printer:r.printer});
          F.H = Math.floor(r.hours||0); F.M = Math.round(((r.hours||0)-F.H)*60); picker.open = {}; rerender(); toast('Kitöltve – csak ellenőrizd, és mentsd.');
        }
      });
      sh.foot.querySelector('[data-save]').onclick = () => save(sh);
      sh.foot.querySelector('[data-dup]')?.addEventListener('click', () => { goBack(); setTimeout(() => openPrintForm(Object.assign({}, F, {hours: num(F.H)+num(F.M)/60}), 'copy'), 260); });
    }
  });
}

    ${tr ? `<div class="hint acc" style="margin-top:14px">${swatch(F.color)} Ez a(z) <b>${esc(tr.name)}</b> készletet növeli (most ${g0(tr.avail)} g).</div>`

      sh.body.addEventListener('change', e => { if (e.target.dataset.field) rerender(); });
      sh.body.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
        if (d.pick) { F[d.pick] = d.v; picker.open[d.pick] = false; rerender(); }
        else if (d.pickother) { picker.open[d.pickother] = true; F[d.pickother] = ''; rerender(); sh.body.querySelector(`[data-picker="${d.pickother}"] input`)?.focus(); }

/* =====================================================================

document.addEventListener('click', e => {
  const b = e.target.closest('[data-tab],[data-act]');
  if (!b || b.closest('#sheets')) return;
  if (b.dataset.tab) return setTab(b.dataset.tab);
  const a = b.dataset.act, d = b.dataset;
  const byRow = row => sortedLog().find(r => String(r.row) === String(row));
  switch (a){
    case 'newPrint': if (S.data) openPrintForm(null, 'new'); else setTab('settings'); break;
    case 'editPrint': { const r = byRow(d.row); if (!r) return; if (r.pending) return toast('Ez még küldésre vár – ha megjött, szerkesztheted.'); openPrintForm(r, 'edit'); break; }
    case 'quickStatus': { const r = byRow(d.row); if (r) write('updatePrint', Object.assign({}, r, {status: d.s, expectModel: r.model}), d.s === 'Kész' ? 'Kész ✓ Szép!' : d.s === 'Rossz' ? 'Rögzítve: rossz lett 😬' : 'Elindítva ▶'); break; }
    case 'more': S.logLimit += 100; render(); break;
    case 'view': S.ui[d.k] = d.v; saveUi(); render(); break;
    case 'stockSort': S.ui.stockSort = d.v; saveUi(); render(); break;
    case 'hideEmpty': S.ui.hideEmpty = !S.ui.hideEmpty; saveUi(); render(); break;
    case 'newDelivery': openDeliveryForm(); break;
    case 'newTracker': openTrackerForm(); break;
    case 'projFilter': S.projFilter = d.v; render(); break;
    case 'editItem': { const it = projItems().find(x => String(x.row) === d.row); if (it) openItemForm(it); break; }
    case 'newItem': openNewItemForm(D().projects[+d.g]); break;
    case 'newProject': openNewProjectForm(); break;
    case 'editCal': { const r = D().cal.rows.find(x => String(x.row) === d.row); if (r) openCalForm(r); break; }
    case 'newCal': openCalForm(null); break;
    case 'statPeriod': S.statPeriod = d.v; render(); break;
    case 'statMetric': S.statMetric = d.v; render(); break;
    case 'projColors': openProjColors(); break;
    case 'ui': S.ui[d.k] = d.v || false; saveUi(); render(); break;
    case 'resetCols': delete S.ui.logCols; saveUi(); render(); toast('Oszlopszélességek visszaállítva'); break;
    case 'font': { const def = FONTS.find(f => f[0] === d.k)[2]; S.cfg.fonts = Object.assign({}, S.cfg.fonts); S.cfg.fonts[d.k] = Math.max(10, Math.min(48, (S.cfg.fonts[d.k] || def) + +d.d)); store.set('cfg', S.cfg); applyFonts(); render(); break; }
    case 'fontReset': S.cfg.fonts = {}; store.set('cfg', S.cfg); applyFonts(); render(); break;
    case 'theme': S.cfg.theme = d.v; store.set('cfg', S.cfg); applyTheme(); render(); break;
    case 'flush': refresh(); break;
    case 'saveCfg': {
      S.cfg.url = $('#s_url').value.trim(); S.cfg.key = $('#s_key').value.trim(); S.cfg.lowG = num($('#s_low').value) || 300;
      store.set('cfg', S.cfg);
      if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(S.cfg.url)) { alertBox('Furcsa a cím', 'A webcímnek így kell kezdődnie: https://script.google.com/macros/s/…\nés „/exec”-re végződnie. Másold ki újra a Telepítés ablakból.'); return; }
      refresh(); break;
    }
  }
});
$('#refreshBtn').addEventListener('click', () => refresh());
$('#setBtn').addEventListener('click', () => setTab('settings'));
document.addEventListener('input', e => {
  if (e.target.id === 'logq'){ S.logQuery = e.target.value; S.logLimit = 80; $('#logList').innerHTML = logListHtml(); }
  if (e.target.id === 'calq'){ S.calQuery = e.target.value; $('#calList').innerHTML = calListHtml(); }
  if (e.target.id === 's_low'){ S.cfg.lowG = num(e.target.value); store.set('cfg', S.cfg); }
});

/* ---------- toast ---------- */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('in'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('in'), 2600); }

/* ---------- billentyűzet takarja a mezőt? ---------- */
document.addEventListener('focusin', e => {
  const el = e.target; if (!el.matches('input,textarea')) return;
  setTimeout(() => {
    const vv = window.visualViewport; if (!vv) return;
    const r = el.getBoundingClientRect(), bottom = vv.height - 20;
    if (r.bottom <= bottom && r.top >= 60) return;
    let p = el.parentElement; while (p && !(p.scrollHeight > p.clientHeight && /auto|scroll/.test(getComputedStyle(p).overflowY))) p = p.parentElement;
    const sc = p || document.scrollingElement;
    if (r.bottom > bottom) sc.scrollTop += Math.min(r.bottom - bottom, r.top - 70);
    else sc.scrollTop -= (60 - r.top) + 10;
  }, 300);
});

/* ---------- indulás ---------- */
applyTheme();
applyFonts();
history.replaceState({fm:0}, '');
render();
if (S.outbox.length) setSync('off', `${S.outbox.length} vár`);
refresh(true);
</script>
